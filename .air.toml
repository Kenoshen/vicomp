root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/vicomp ./cmd/vicomp"
  entrypoint = ["./tmp/vicomp"]
  include_ext = ["go", "html", "css", "sql"]
  exclude_dir = ["tmp", ".git", ".github"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  # Docker-on-macOS bind mounts don't always deliver fsnotify events; poll instead.
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true

[log]
  time = true
