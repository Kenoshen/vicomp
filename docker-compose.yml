services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vicomp
      POSTGRES_PASSWORD: vicomp
      POSTGRES_DB: vicomp
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicomp -d vicomp"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--log-level=warn"
    ports:
      - "3001:3000"

  app:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://vicomp:vicomp@db:5432/vicomp?sslmode=disable
      GOTENBERG_URL: http://gotenberg:3000
      LISTEN_ADDR: ":8080"
    ports:
      - "8090:8080"
    # Source is bind-mounted so `air` rebuilds on save. The module cache is a
    # named volume so restarts stay fast.
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started

volumes:
  db_data:
  go_mod_cache:
